[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medanon"
version = "0.1.0"
description = "Context-aware, clinically informed anonymization of doctor-patient encounters (Bosch Neural Wave 2026)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "spacy>=3.8,<3.9",
  "presidio-analyzer>=2.2",
  "pyyaml>=6",
  "psutil>=5.9",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.51"]
comparison = ["gliner>=0.2.20", "gliner2>=1.0"]
build = ["wordfreq>=3.1", "simple-icd-10-cm>=1.5"]
dev = ["pytest>=8"]

[project.scripts]
medanon = "medanon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medanon = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
